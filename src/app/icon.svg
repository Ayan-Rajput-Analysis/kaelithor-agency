<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B2B" />
      <stop offset="100%" stop-color="#FF4F00" />
    </linearGradient>
    <linearGradient id="glass-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#FF4F00" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagonal Glass Jewel Base -->
  <rect width="64" height="64" rx="16" fill="#0C101B" />
  <rect width="64" height="64" rx="16" fill="none" stroke="url(#glass-rim)" stroke-width="1.5" />

  <!-- Geometric "K" Prism Mark -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <path d="M20 16 L28 16 L28 48 L20 48 Z" fill="url(#prism-grad)" />
    <!-- Upper Diagonal Facet -->
    <polygon points="28,28 44,16 48,20 34,32" fill="#FFFFFF" fill-opacity="0.95" />
    <!-- Lower Diagonal Facet -->
    <polygon points="30,30 48,44 43,48 28,34" fill="url(#prism-grad)" />
  </g>
</svg>
